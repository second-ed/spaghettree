[project]
name = "spaghettree"
version = "0.3.0"
description = "Code that reorganises code"
readme = "README.md"
authors = [
    { name = "ed cuss", email = "edcussmusic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.4.0",
    "black>=25.1.0",
    "danom>=0.10.0",
    "isort>=6.0.1",
    "libcst>=1.6.0",
    "numpy>=2.3.2",
    "polars>=1.38.1",
    "python-dotenv>=1.1.1",
    "ruff>=0.12.9",
    "tqdm>=4.67.1",
]

[project.scripts]
spaghettree = "spaghettree:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "hypothesis>=6.140.2",
    "ipykernel>=6.29.5",
    "papertrail>=0.1.2",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "repo-mapper-rs>=0.3.0",
    "ruff>=0.9.9",
]

[tool.pytest.ini_options]
addopts = [
    "-vv",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]
